name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ddtcorex/dsh-maestro-ci/.github/workflows/node-plugin.yml@f32468056f80d66f1ada4dc303e5df99ba42af0f
    with:
      run-build: false
      require-lib-index: false
      sibling-repos: |
        dsh-maestro-config-lib master packages/dsh-maestro-config-lib
        dsh-maestro-remote master packages/dsh-maestro-remote
        dsh-maestro-review master packages/dsh-maestro-review
        dsh-maestro-govard master packages/dsh-maestro-govard
        dsh-maestro-memory master packages/dsh-maestro-memory
        dsh-maestro-mobile master packages/dsh-maestro-mobile
        dsh-maestro-notifier master packages/dsh-maestro-notifier
        dsh-maestro-config master packages/dsh-maestro-config
        maestro-skills master maestro-skills
